name: codex-review-signal
run-name: codex-review-signal pr-${{ github.event.pull_request.number }} head-${{ github.event.pull_request.head.sha }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  signal:
    name: codex-review-artifact-changed
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Signal trusted reconciliation
        shell: bash
        run: "true"
