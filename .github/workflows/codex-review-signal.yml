name: codex-review-signal
run-name: codex-review-signal p-${{ github.event.pull_request.number }} h-${{ github.event.pull_request.head.sha }} b-${{ github.event.pull_request.base.sha }} e-${{ github.event_name }} a-${{ github.event.action }} i-${{ github.event.review.id || github.event.comment.id }} r-${{ github.event.review.id || github.event.comment.pull_request_review_id }} c-${{ github.event.review.commit_id || github.event.comment.commit_id }} x-${{ github.event.review.submitted_at || github.event.comment.updated_at || github.event.comment.created_at }} u-${{ github.event.review.user.login || github.event.comment.user.login }} t-${{ github.event.review.user.type || github.event.comment.user.type }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  signal:
    name: codex-review-artifact-changed
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Signal trusted reconciliation
        shell: bash
        run: "true"
