name: docs-ci
# HARNESS_TRUSTED_DOC_STATUS_V4

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  repository_dispatch:
    types: [loop-checkpoints-reconcile]
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.event.client_payload.pull_request_number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-pull-request:
    name: resolve-live-pull-request
    if: github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repository: ${{ steps.resolve.outputs.head_repository }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Resolve and bind the live pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pull_request_number }}
          TRIGGERING_DEFAULT_SHA: ${{ github.event.client_payload.triggering_default_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number: ${PULL_REQUEST_NUMBER}" >&2
            exit 1
          fi
          pull_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
          state="$(jq -r '.state' <<<"${pull_json}")"
          base_repository="$(jq -r '.base.repo.full_name' <<<"${pull_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pull_json}")"
          head_repository="$(jq -r '.head.repo.full_name // empty' <<<"${pull_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pull_json}")"
          if [[ "${state}" != open || "${base_repository}" != "${GITHUB_REPOSITORY}" || "${base_ref}" != main ]]; then
            echo "Pull request is not an open PR against ${GITHUB_REPOSITORY}:main" >&2
            exit 1
          fi
          if [[ -z "${head_repository}" || ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull request head identity is incomplete" >&2
            exit 1
          fi
          base_sha="$(
            gh api "repos/${base_repository}/git/ref/heads/${base_ref}" --jq '.object.sha'
          )"
          base_sha="${base_sha,,}"
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Live base ref identity is incomplete" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == repository_dispatch ]]; then
            if [[ ! "${TRIGGERING_DEFAULT_SHA}" =~ ^[0-9a-f]{40}$ || "${TRIGGERING_DEFAULT_SHA}" != "${base_sha}" ]]; then
              echo "Stale or malformed default-branch reconciliation payload." >&2
              exit 1
            fi
          fi
          {
            echo "pull_request_number=${PULL_REQUEST_NUMBER}"
            echo "head_sha=${head_sha}"
            echo "head_repository=${head_repository}"
            echo "base_sha=${base_sha}"
            echo "base_ref=${base_ref}"
          } >>"${GITHUB_OUTPUT}"

  mark-checkpoints-pending:
    name: mark-loop-checkpoints-pending
    if: ${{ always() && needs.resolve-pull-request.result == 'success' }}
    needs: resolve-pull-request
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark the live PR head pending
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve-pull-request.outputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pull-request.outputs.head_sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ needs.resolve-pull-request.outputs.head_repository }}
          EXPECTED_BASE_SHA: ${{ needs.resolve-pull-request.outputs.base_sha }}
          STATUS_CONTEXT: loop/checkpoints
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          verify_live_identity() {
            local pull_json live_state live_base_repository live_base_ref
            local live_base_sha live_head_repository live_head_sha
            pull_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
            live_state="$(jq -r '.state' <<<"${pull_json}")"
            live_base_repository="$(jq -r '.base.repo.full_name' <<<"${pull_json}")"
            live_base_ref="$(jq -r '.base.ref' <<<"${pull_json}")"
            live_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"${pull_json}")"
            live_head_sha="$(jq -r '.head.sha' <<<"${pull_json}")"
            if [[ "${live_state}" != open || "${live_base_repository}" != "${GITHUB_REPOSITORY}" || "${live_base_ref}" != main || "${live_head_repository}" != "${EXPECTED_HEAD_REPOSITORY}" || "${live_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
              echo "Pull request identity no longer matches the pending status binding." >&2
              return 1
            fi
            live_base_sha="$(
              gh api "repos/${live_base_repository}/git/ref/heads/${live_base_ref}" --jq '.object.sha'
            )"
            live_base_sha="${live_base_sha,,}"
            if [[ "${live_base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
              echo "Live base ref no longer matches the pending status binding." >&2
              return 1
            fi
          }

          verify_bound_head_with_base_drift() {
            local pull_json live_state live_base_repository live_base_ref
            local live_base_sha live_head_repository live_head_sha
            pull_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
            live_state="$(jq -r '.state' <<<"${pull_json}")"
            live_base_repository="$(jq -r '.base.repo.full_name' <<<"${pull_json}")"
            live_base_ref="$(jq -r '.base.ref' <<<"${pull_json}")"
            live_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"${pull_json}")"
            live_head_sha="$(jq -r '.head.sha' <<<"${pull_json}")"
            if [[ "${live_state}" != open || "${live_base_repository}" != "${GITHUB_REPOSITORY}" || "${live_base_ref}" != main || "${live_head_repository}" != "${EXPECTED_HEAD_REPOSITORY}" || "${live_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
              return 1
            fi
            live_base_sha="$(
              gh api "repos/${live_base_repository}/git/ref/heads/${live_base_ref}" --jq '.object.sha'
            )"
            live_base_sha="${live_base_sha,,}"
            [[ "${live_base_sha}" != "${EXPECTED_BASE_SHA}" ]]
          }

          fail_closed_before_pending_write() {
            local prewrite_drift_description statuses_json latest_status
            if ! verify_bound_head_with_base_drift; then
              echo "Pending identity verification failed without a stable bound-head base drift." >&2
              return 1
            fi
            prewrite_drift_description="Live base changed before pending status; expected=${EXPECTED_BASE_SHA}."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
              -f state=failure \
              -f context="${STATUS_CONTEXT}" \
              -f description="${prewrite_drift_description}" \
              -f target_url="${RUN_URL}"
            if ! verify_bound_head_with_base_drift; then
              echo "Pull request identity changed after the pre-pending fail-closed write." >&2
              return 1
            fi
            statuses_json="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/statuses?per_page=100"
            )"
            latest_status="$(
              jq -c --arg context "${STATUS_CONTEXT}" \
                '[.[][] | select(.context == $context)][0] // {}' \
                <<<"${statuses_json}"
            )"
            if [[ "$(jq -r '.state // empty' <<<"${latest_status}")" != failure || "$(jq -r '.description // empty' <<<"${latest_status}")" != "${prewrite_drift_description}" || "$(jq -r '.creator.login // empty' <<<"${latest_status}")" != "github-actions[bot]" || "$(jq -r '.creator.type // empty' <<<"${latest_status}")" != Bot ]]; then
              echo "Failed to leave the bound head with the latest pre-pending fail-closed status." >&2
              return 1
            fi
            echo "The live base drifted before pending; the bound head was failed closed." >&2
          }

          fail_closed_after_status_write() {
            local drift_description statuses_json latest_status
            if verify_live_identity; then
              return 0
            fi
            drift_description="PR identity changed after status write; base=${EXPECTED_BASE_SHA}."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
              -f state=failure \
              -f context="${STATUS_CONTEXT}" \
              -f description="${drift_description}" \
              -f target_url="${RUN_URL}"
            statuses_json="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/statuses?per_page=100"
            )"
            latest_status="$(
              jq -c --arg context "${STATUS_CONTEXT}" \
                '[.[][] | select(.context == $context)][0] // {}' \
                <<<"${statuses_json}"
            )"
            if [[ "$(jq -r '.state // empty' <<<"${latest_status}")" != failure || "$(jq -r '.description // empty' <<<"${latest_status}")" != "${drift_description}" || "$(jq -r '.creator.login // empty' <<<"${latest_status}")" != "github-actions[bot]" || "$(jq -r '.creator.type // empty' <<<"${latest_status}")" != Bot ]]; then
              echo "Failed to leave the bound head with the latest fail-closed status." >&2
              return 1
            fi
            echo "Pull request identity drifted after the pending write; the bound head was failed closed." >&2
            return 1
          }

          pending_description="Reconciling trusted checkpoint evidence; base=${EXPECTED_BASE_SHA}."
          success_description="Trusted checkpoint evidence is complete; base=${EXPECTED_BASE_SHA}."
          failure_description="Trusted checkpoint evidence failed; base=${EXPECTED_BASE_SHA}."
          pending_failure_description="Pending status failed; validation did not run; base=${EXPECTED_BASE_SHA}."
          if ! verify_live_identity; then
            fail_closed_before_pending_write
            exit 1
          fi
          statuses_json="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/statuses?per_page=100"
          )"
          latest_status="$(
            jq -c --arg context "${STATUS_CONTEXT}" \
              '[.[][] | select(.context == $context)][0] // {}' \
              <<<"${statuses_json}"
          )"
          latest_state="$(jq -r '.state // empty' <<<"${latest_status}")"
          latest_description="$(jq -r '.description // empty' <<<"${latest_status}")"
          latest_creator_login="$(jq -r '.creator.login // empty' <<<"${latest_status}")"
          latest_creator_type="$(jq -r '.creator.type // empty' <<<"${latest_status}")"
          if ! verify_live_identity; then
            fail_closed_before_pending_write
            exit 1
          fi
          if [[ "${latest_creator_login}" == "github-actions[bot]" && "${latest_creator_type}" == Bot ]]; then
            case "${latest_state}:${latest_description}" in
              "pending:${pending_description}"|\
              "success:${success_description}"|\
              "failure:${failure_description}"|\
              "failure:${pending_failure_description}")
                echo "Current PR identity already has a reconciled ${STATUS_CONTEXT} status; skipping duplicate pending write."
                exit 0
                ;;
            esac
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
            -f state=pending \
            -f context=loop/checkpoints \
            -f description="${pending_description}" \
            -f target_url="${RUN_URL}"
          fail_closed_after_status_write

  pull-request-checkpoints:
    name: trusted-loop-checkpoints
    if: ${{ always() && needs.resolve-pull-request.result == 'success' && needs.mark-checkpoints-pending.result == 'success' }}
    needs: [resolve-pull-request, mark-checkpoints-pending]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the untrusted validation target as data
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-pull-request.outputs.head_repository }}
          ref: ${{ needs.resolve-pull-request.outputs.head_sha }}
          # This checkout is parsed as data only; target code is never executed here.
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Check out verifiers from the trusted PR base
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve-pull-request.outputs.base_sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Make the trusted base available to the validation clone
        env:
          PR_BASE_SHA: ${{ needs.resolve-pull-request.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.resolve-pull-request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_base_sha="$(git -C trusted rev-parse HEAD)"
          if [[ "${actual_base_sha}" != "${PR_BASE_SHA}" ]]; then
            echo "The trusted checkout does not match the bound live base ref." >&2
            exit 1
          fi
          git -c protocol.file.allow=always -C target fetch \
            --no-tags --no-recurse-submodules \
            "${GITHUB_WORKSPACE}/trusted" "${PR_BASE_SHA}"
          merge_tree="$(
            git -C target merge-tree --write-tree \
              "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          )"
          if [[ ! "${merge_tree}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to materialize the pull request merge tree." >&2
            exit 1
          fi
          merge_commit="$(
            printf '%s\n' 'Synthetic merge tree for trusted validation.' |
            env \
              GIT_AUTHOR_NAME='Harness Validator' \
              GIT_AUTHOR_EMAIL='harness-validator@invalid' \
              GIT_COMMITTER_NAME='Harness Validator' \
              GIT_COMMITTER_EMAIL='harness-validator@invalid' \
              git -c core.hooksPath=/dev/null -C target commit-tree \
                "${merge_tree}" -p "${PR_BASE_SHA}" -p "${PR_HEAD_SHA}"
          )"
          git -C target reset --hard "${merge_commit}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate with trusted code
        env:
          HARNESS_REPO_ROOT: ${{ github.workspace }}/target
          HARNESS_TRUSTED_REPO_ROOT: ${{ github.workspace }}/trusted
          PR_BASE_SHA: ${{ needs.resolve-pull-request.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.resolve-pull-request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -I -B trusted/scripts/check_docs.py --all
          python3 -I -B trusted/scripts/check_loop_checkpoints.py \
            --base "${PR_BASE_SHA}" --head HEAD

  publish-checkpoints-result:
    name: publish-loop-checkpoints-result
    if: ${{ always() && needs.resolve-pull-request.result == 'success' }}
    needs: [resolve-pull-request, mark-checkpoints-pending, pull-request-checkpoints]
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish only if the pull request identity is still live
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve-pull-request.outputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pull-request.outputs.head_sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ needs.resolve-pull-request.outputs.head_repository }}
          EXPECTED_BASE_SHA: ${{ needs.resolve-pull-request.outputs.base_sha }}
          STATUS_CONTEXT: loop/checkpoints
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PENDING_RESULT: ${{ needs.mark-checkpoints-pending.result }}
          VALIDATION_RESULT: ${{ needs.pull-request-checkpoints.result }}
        shell: bash
        run: |
          set -euo pipefail

          verify_live_identity() {
            local pull_json live_state live_base_repository live_base_ref
            local live_base_sha live_head_repository live_head_sha
            pull_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
            live_state="$(jq -r '.state' <<<"${pull_json}")"
            live_base_repository="$(jq -r '.base.repo.full_name' <<<"${pull_json}")"
            live_base_ref="$(jq -r '.base.ref' <<<"${pull_json}")"
            live_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"${pull_json}")"
            live_head_sha="$(jq -r '.head.sha' <<<"${pull_json}")"
            if [[ "${live_state}" != open || "${live_base_repository}" != "${GITHUB_REPOSITORY}" || "${live_base_ref}" != main || "${live_head_repository}" != "${EXPECTED_HEAD_REPOSITORY}" || "${live_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
              echo "Pull request identity changed during validation; refusing a stale status write." >&2
              return 1
            fi
            live_base_sha="$(
              gh api "repos/${live_base_repository}/git/ref/heads/${live_base_ref}" --jq '.object.sha'
            )"
            live_base_sha="${live_base_sha,,}"
            if [[ "${live_base_sha}" != "${EXPECTED_BASE_SHA}" ]]; then
              echo "Live base ref changed during validation; refusing a stale status write." >&2
              return 1
            fi
          }

          fail_closed_after_status_write() {
            local drift_description statuses_json latest_status
            if verify_live_identity; then
              return 0
            fi
            drift_description="PR identity changed after status write; base=${EXPECTED_BASE_SHA}."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
              -f state=failure \
              -f context="${STATUS_CONTEXT}" \
              -f description="${drift_description}" \
              -f target_url="${RUN_URL}"
            statuses_json="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/statuses?per_page=100"
            )"
            latest_status="$(
              jq -c --arg context "${STATUS_CONTEXT}" \
                '[.[][] | select(.context == $context)][0] // {}' \
                <<<"${statuses_json}"
            )"
            if [[ "$(jq -r '.state // empty' <<<"${latest_status}")" != failure || "$(jq -r '.description // empty' <<<"${latest_status}")" != "${drift_description}" || "$(jq -r '.creator.login // empty' <<<"${latest_status}")" != "github-actions[bot]" || "$(jq -r '.creator.type // empty' <<<"${latest_status}")" != Bot ]]; then
              echo "Failed to leave the bound head with the latest fail-closed status." >&2
              return 1
            fi
            echo "Pull request identity drifted after the final write; the bound head was failed closed." >&2
            return 1
          }

          if [[ "${PENDING_RESULT}" != success ]]; then
            state=failure
            description="Pending status failed; validation did not run; base=${EXPECTED_BASE_SHA}."
          elif [[ "${VALIDATION_RESULT}" == success ]]; then
            state=success
            description="Trusted checkpoint evidence is complete; base=${EXPECTED_BASE_SHA}."
          else
            state=failure
            description="Trusted checkpoint evidence failed; base=${EXPECTED_BASE_SHA}."
          fi
          fail_closed_after_status_write
          statuses_json="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/statuses?per_page=100"
          )"
          latest_status="$(
            jq -c --arg context "${STATUS_CONTEXT}" \
              '[.[][] | select(.context == $context)][0] // {}' \
              <<<"${statuses_json}"
          )"
          latest_state="$(jq -r '.state // empty' <<<"${latest_status}")"
          latest_description="$(jq -r '.description // empty' <<<"${latest_status}")"
          latest_creator_login="$(jq -r '.creator.login // empty' <<<"${latest_status}")"
          latest_creator_type="$(jq -r '.creator.type // empty' <<<"${latest_status}")"
          fail_closed_after_status_write
          if [[ "${latest_creator_login}" == "github-actions[bot]" && "${latest_creator_type}" == Bot && "${latest_state}" == "${state}" && "${latest_description}" == "${description}" ]]; then
            echo "Current PR identity already has the requested ${STATUS_CONTEXT} result; skipping duplicate final write."
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
            -f state="${state}" \
            -f context=loop/checkpoints \
            -f description="${description}" \
            -f target_url="${RUN_URL}"
          fail_closed_after_status_write

  dispatch-open-pull-requests:
    name: reconcile-open-pull-requests
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile every open PR against the new trusted base
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[].number' |
          while IFS= read -r pull_request_number; do
            [[ -n "${pull_request_number}" ]] || continue
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=loop-checkpoints-reconcile \
              -F "client_payload[pull_request_number]=${pull_request_number}" \
              -f "client_payload[triggering_default_sha]=${DEFAULT_SHA}"
          done

  default-branch-checkpoints:
    name: default-branch-docs-check
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          HARNESS_STANDALONE_BASE_SHA: ${{ github.event.before }}
        run: python3 -I -B scripts/check_docs.py --all
      - name: Validate the pushed scope against its predecessor
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          if [[ ! "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "github.event.before is not an exact commit SHA." >&2
            exit 1
          fi
          if [[ "${BEFORE_SHA}" != "${zero_sha}" ]]; then
            git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null
            python3 -I -B scripts/check_loop_checkpoints.py \
              --base "${BEFORE_SHA}" --head HEAD --diff-mode direct
            exit 0
          fi

          if [[ "$(git rev-list --parents -n 1 HEAD)" == *" "* ]]; then
            echo "A zero-before created-ref push must point at a root commit." >&2
            exit 1
          fi
          python3 -I -B scripts/check_loop_checkpoints.py \
            --head HEAD --diff-mode root
