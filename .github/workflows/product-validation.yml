name: product-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: product/validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I -B scripts/check_docs.py --self-test
      - run: python3 -I -B tests/test_check_docs.py
      - run: bash scripts/test.sh
